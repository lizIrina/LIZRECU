version: "3.8"
services:
  llinin:
    image: ghcr.io/(user de liz)/llinin:1.0.5
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.llinin.entrypoints=http"
        - "traefik.http.routers.llinin.rule=Host(`llinin.byronrm.com`)"
        - "traefik.http.middlewares.llinin-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.llinin.middlewares=llinin-https-redirect"
        - "traefik.http.routers.llinin-secure.entrypoints=https"
        - "traefik.http.routers.llinin-secure.rule=Host(`llinin.byronrm.com`)"
        - "traefik.http.routers.llinin-secure.tls=true"
        - "traefik.http.routers.llinin-secure.tls.certresolver=http"
        - "traefik.http.routers.llinin-secure.service=llinin"
        - "traefik.http.services.llinin.loadbalancer.server.port=3000"
        - "traefik.docker.network=traefik-public"
    networks:
      - traefik-public
networks:
  traefik-public:
    external: true
