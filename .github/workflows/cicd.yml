name: CI/CD - Build, Publish y Deploy
on:
  push:
    branches: [ morocho ]
  pull_request:
    branches: [ morocho ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout codigo
      uses: actions/checkout@v3
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/(user de liz)/llinin:1.0.5
          ghcr.io/(user de liz)/llinin:latest
    - name: Verificar imagen publicada
      run: |
        echo "Imagen publicada exitosamente:"
        echo "ghcr.io/(user de liz)/llinin:1.0.5"
        echo "ghcr.io/(user de liz)/llinin:latest"
    - name: Copiar stack.yml al servidor
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        source: "stack.yml"
        target: "/home/${{ secrets.VPS_USER }}/deploy"
    - name: Deploy automatico en VPS
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          echo "Iniciando despliegue automatico..."
          cd ~/deploy
          
          echo "Login a GitHub Container Registry"
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u (user de liz) --password-stdin
          
          echo "Descargando imagen actualizada"
          docker pull ghcr.io/(user de liz)/llinin:1.0.5
          
          echo "Eliminando stack anterior si existe"
          docker stack rm llinin || true
          
          echo "Esperando 15 segundos..."
          sleep 15
          
          echo "Desplegando nuevo stack"
          docker stack deploy --with-registry-auth -c stack.yml llinin
          
          echo "Verificando servicios"
          docker service ls | grep llinin
          
          echo "Despliegue completado exitosamente"
          echo "Aplicacion disponible en: https://llinin.byronrm.com"
